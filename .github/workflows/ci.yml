name: CI

on:
  push:
    branches:
      - main
      - "feat/**"
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Zig 0.16 macOS
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Test with the null platform
        run: zig build test -Dplatform=null --summary all
      - name: Build the arm64 macOS app
        run: zig build -Dtarget=aarch64-macos -Doptimize=ReleaseSafe --summary all
