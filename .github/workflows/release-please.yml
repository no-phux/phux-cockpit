# Release Please owns version PRs, tags, draft releases, and release notes.
# The reusable release workflow owns artifacts, verification, publication, and
# Homebrew. Calling it directly avoids relying on events raised by GITHUB_TOKEN,
# which GitHub intentionally does not use to start another workflow.
name: Release Please

on:
  push:
    branches:
      - main

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    name: Maintain release PR
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      prs_created: ${{ steps.release.outputs.prs_created }}
      pr_branch: ${{ steps.release.outputs.pr && fromJSON(steps.release.outputs.pr).headBranchName || '' }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  validate-release-pr:
    name: Validate release PR
    needs: release-please
    if: needs.release-please.outputs.prs_created == 'true' && needs.release-please.outputs.pr_branch != ''
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      actions: write
    steps:
      - name: Dispatch CI on the generated branch
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BRANCH: ${{ needs.release-please.outputs.pr_branch }}
        run: gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$PR_BRANCH"

  release-artifacts:
    name: Build and publish macOS artifacts
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    uses: ./.github/workflows/release.yml
    permissions:
      contents: write
    secrets:
      HOMEBREW_TAP_DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
      MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
      APPLE_NOTARY_KEY: ${{ secrets.APPLE_NOTARY_KEY }}
      APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
      APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}

  # Report the release to the Linear `phux-cockpit` pipeline, which resolves the
  # issues a release carried from the Linear identifiers and PR references in
  # its commit range. Syncing at tag time puts it in Building; the promote job
  # below moves it to Released once the signed, notarised artifacts are
  # published, so a failed build leaves the release visibly stuck rather than
  # silently absent.
  linear-release-sync:
    name: report release to Linear
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          # The CLI scans the whole commit range, so shallow will not do.
          fetch-depth: 0
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Capture the GitHub release body as the Linear release notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          set -euo pipefail
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body \
            > release-notes.md || : > release-notes.md

      - uses: linear/linear-release-action@17b8c24f8ceb2b98cabaf1965ff83c55dd596fac # v0.15.1
        with:
          access_key: ${{ secrets.LINEAR_RELEASE_ACCESS_KEY }}
          command: sync
          version: ${{ needs.release-please.outputs.tag_name }}
          release_notes: release-notes.md
          links: |
            GitHub release=${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ needs.release-please.outputs.tag_name }}

  linear-release-promote:
    name: mark the Linear release released
    needs: [release-please, release-artifacts]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          ref: ${{ needs.release-please.outputs.tag_name }}

      - uses: linear/linear-release-action@17b8c24f8ceb2b98cabaf1965ff83c55dd596fac # v0.15.1
        with:
          access_key: ${{ secrets.LINEAR_RELEASE_ACCESS_KEY }}
          command: update
          stage: Released
          version: ${{ needs.release-please.outputs.tag_name }}
