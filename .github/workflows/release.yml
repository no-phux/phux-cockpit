name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and publish
        required: true
        type: string

permissions:
  contents: write

jobs:
  macos:
    name: Package arm64 macOS release
    runs-on: macos-26
    timeout-minutes: 45
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_TAG }}

      - name: Validate release tag
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$(git rev-parse HEAD)" = "$(git rev-parse "$RELEASE_TAG^{commit}")"

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Configure Developer ID signing when available
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          supplied=0
          [[ -n "${MACOS_CERTIFICATE}" ]] && supplied=$((supplied + 1))
          [[ -n "${MACOS_CERTIFICATE_PASSWORD}" ]] && supplied=$((supplied + 1))
          [[ -n "${SIGNING_IDENTITY}" ]] && supplied=$((supplied + 1))
          if [[ "${supplied}" -eq 0 ]]; then
            echo "No Developer ID secrets configured; the release will be ad-hoc signed."
            exit 0
          fi
          if [[ "${supplied}" -ne 3 ]]; then
            echo "Developer ID secrets are incomplete; the release will be ad-hoc signed." >&2
            exit 0
          fi

          certificate_path="${RUNNER_TEMP}/developer-id.p12"
          keychain_path="${RUNNER_TEMP}/phux-cockpit-signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          printf '%s' "${MACOS_CERTIFICATE}" | base64 -D > "${certificate_path}"
          security create-keychain -p "${keychain_password}" "${keychain_path}"
          security set-keychain-settings -lut 21600 "${keychain_path}"
          security unlock-keychain -p "${keychain_password}" "${keychain_path}"
          security import "${certificate_path}" -P "${MACOS_CERTIFICATE_PASSWORD}" -A -t cert -f pkcs12 -k "${keychain_path}"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "${keychain_password}" "${keychain_path}"
          security list-keychains -d user -s "${keychain_path}"
          {
            echo "MACOS_SIGNING_IDENTITY=${SIGNING_IDENTITY}"
            echo "SIGNING_KEYCHAIN=${keychain_path}"
          } >> "${GITHUB_ENV}"

      - name: Configure notarization when available
        env:
          NOTARY_KEY: ${{ secrets.APPLE_NOTARY_KEY }}
          NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          supplied=0
          [[ -n "${NOTARY_KEY}" ]] && supplied=$((supplied + 1))
          [[ -n "${NOTARY_KEY_ID}" ]] && supplied=$((supplied + 1))
          [[ -n "${NOTARY_ISSUER_ID}" ]] && supplied=$((supplied + 1))
          if [[ "${supplied}" -eq 0 ]]; then
            echo "No notarization secrets configured; the release will be marked unnotarized."
            exit 0
          fi
          if [[ "${supplied}" -ne 3 ]]; then
            echo "Notarization secrets are incomplete; the release will be marked unnotarized." >&2
            exit 0
          fi

          key_path="${RUNNER_TEMP}/AuthKey_${NOTARY_KEY_ID}.p8"
          printf '%s' "${NOTARY_KEY}" | base64 -D > "${key_path}"
          {
            echo "APPLE_NOTARY_KEY_PATH=${key_path}"
            echo "APPLE_NOTARY_KEY_ID=${NOTARY_KEY_ID}"
            echo "APPLE_NOTARY_ISSUER_ID=${NOTARY_ISSUER_ID}"
          } >> "${GITHUB_ENV}"

      - name: Test
        run: zig build test -Dplatform=null --summary all

      - name: Build, sign, verify, and package
        id: package
        run: |
          set -euo pipefail
          export VERSION="${RELEASE_TAG#v}"
          ./scripts/package-macos.sh

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNING_MODE: ${{ steps.package.outputs.signing }}
          NOTARIZED: ${{ steps.package.outputs.notarized }}
        run: |
          set -euo pipefail
          notes="$(mktemp)"
          if [[ "${NOTARIZED}" == "true" ]]; then
            cat > "${notes}" <<EOF
          This release is Developer ID signed and Apple-notarized.
          EOF
          else
            cat > "${notes}" <<EOF
          This release is ad-hoc signed because Developer ID and notarization
          credentials are not configured. The Homebrew cask clears the app's
          quarantine attribute and reports this in its installation caveat.
          Signing mode: ${SIGNING_MODE}.
          EOF
          fi
          gh release create "${RELEASE_TAG}" \
            zig-out/release/*.zip \
            zig-out/release/*.dmg \
            zig-out/release/SHA256SUMS \
            --verify-tag \
            --title "Phux Cockpit ${RELEASE_TAG}" \
            --notes-file "${notes}"

      - name: Require Homebrew tap deploy key
        env:
          DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
        run: |
          if [[ -z "$DEPLOY_KEY" ]]; then
            echo "::error::HOMEBREW_TAP_DEPLOY_KEY must target phall1/homebrew-tap with write access."
            exit 1
          fi

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          repository: phall1/homebrew-tap
          ssh-key: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
          path: tap

      - name: Update Homebrew tap
        env:
          NOTARIZED: ${{ steps.package.outputs.notarized }}
        run: |
          set -euo pipefail
          TAG="$RELEASE_TAG"
          [[ "$TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]
          version="${BASH_REMATCH[1]}"
          archive="phux-cockpit-$version-macos-arm64.zip"
          expected="$(awk -v file="$archive" '$2 == file { print $1 }' zig-out/release/SHA256SUMS)"
          actual="$(shasum -a 256 "zig-out/release/$archive" | cut -d ' ' -f 1)"
          [[ "$expected" =~ ^[0-9a-f]{64}$ ]]
          [[ "$actual" == "$expected" ]]
          cd tap
          bash .github/scripts/gen-phux-cockpit-cask.sh "$TAG" "$actual" "$NOTARIZED" Casks/phux-cockpit.rb
          ruby -c Casks/phux-cockpit.rb
          bash .github/scripts/commit-update.sh Casks/phux-cockpit.rb "Brew cask update for Phux Cockpit $TAG"

      - name: Remove temporary signing keychain
        if: always()
        run: |
          if [[ -n "${SIGNING_KEYCHAIN:-}" ]]; then
            security delete-keychain "${SIGNING_KEYCHAIN}" || true
          fi
